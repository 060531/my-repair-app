    /**
 * คำนวณอายุการใช้งาน จากวันที่ซื้อ (format dd/mm/yyyy BE)
 * คืนค่าเป็น "N ปี M เดือน D วัน"
 */
function calcLife(purchased) {
  // แปลง string เป็น Date object
  const [dd, mm, yyBE] = purchased.split('/').map(n => parseInt(n, 10));
  const buyYear = yyBE - 543;
  const buyDate = new Date(buyYear, mm - 1, dd);

  const now = new Date();

  let years = now.getFullYear() - buyDate.getFullYear();
  let months = now.getMonth() - buyDate.getMonth();
  let days = now.getDate() - buyDate.getDate();

  // ถ้าวันลบออกมาเป็นลบ ให้ยืมเดือนก่อน
  if (days < 0) {
    // หาเดือนก่อนหน้า
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
    months--;
  }

  // ถ้าเดือนลบออกมาเป็นลบ ให้ยืมปี
  if (months < 0) {
    months += 12;
    years--;
  }

  return `${years} ปี ${months} เดือน ${days} วัน`;
}

    // สร้างแถวตาราง
    function appendRow(it, idx){
      const tbody = document.getElementById('itemTableBody');
      const tr = document.createElement('tr');
      tr.dataset.id = it.id;
      tr.innerHTML = `
        <td>${idx+1}</td>
        <td contenteditable data-field="model">${it.model}</td>
        <td>
          <select class="form-select form-select-sm status-select" data-id="${it.id}">
            <option ${it.status==='พร้อมใช้'?'selected':''}>พร้อมใช้</option>
            <option ${it.status==='รอซ่อม'?'selected':''}>รอซ่อม</option>
          </select>
        </td>
        <td contenteditable data-field="asset">${it.asset}</td>
        <td contenteditable data-field="msk">${it.msk}</td>
        <td contenteditable data-field="brand">${it.brand}</td>
        <td contenteditable data-field="purchased">${it.purchased}</td>
        <td contenteditable data-field="price">${it.price}</td>
        <td contenteditable data-field="vendor">${it.vendor}</td>
        <td>${calcLife(it.purchased)}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-danger delete-btn" data-id="${it.id}">ลบ</button>
        </td>`;
      tbody.appendChild(tr);
    }

    // แสดงตารางตามหมวด
    function renderTable(category){
      document.getElementById('itemTableBody').innerHTML = '';
      const list = items.filter(i=>i.type === category);
      list.forEach((it, idx)=> appendRow(it, idx));
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      // ตั้งค่าปุ่มหมวด
      document.querySelectorAll('.btn-cat').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.btn-cat').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          renderTable(btn.dataset.cat);
        });
      });
      // เปิดเริ่มต้นที่ Respirator
      document.querySelector('.btn-cat[data-cat="Respirator"]').click();

      // เปลี่ยนสถานะ
      document.getElementById('itemTableBody').addEventListener('change', e=>{
        if(e.target.matches('.status-select')){
          const id = parseInt(e.target.dataset.id);
          const rec = items.find(i=>i.id===id);
          rec.status = e.target.value;
          saveItems();
        }
      });

      // inline edit (blur)
      document.getElementById('itemTableBody').addEventListener('blur', e=>{
        if(e.target.hasAttribute('contenteditable')){
          const field = e.target.dataset.field;
          const tr = e.target.closest('tr');
          const id = parseInt(tr.dataset.id);
          const rec = items.find(i=>i.id===id);
          rec[field] = e.target.textContent.trim();
          saveItems();
          // ถ้าแก้ purchased ให้รีเรนเดอร์อายุใหม่
          if(field==='purchased'){
            tr.children[9].textContent = calcLife(rec.purchased);
          }
        }
      }, true);

      // ลบรายการ
      document.getElementById('itemTableBody').addEventListener('click', e=>{
        if(e.target.matches('.delete-btn')){
          const id = parseInt(e.target.dataset.id);
          if(confirm('ยืนยันลบรายการนี้?')){
            items = items.filter(i=>i.id!==id);
            saveItems();
            // รีเรนเดอร์หมวดปัจจุบัน
            const cat = document.querySelector('.btn-cat.active').dataset.cat;
            renderTable(cat);
          }
        }
      });
    });
