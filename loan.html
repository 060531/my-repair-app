<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>แบบฟอร์มยืมอุปกรณ์</title>
  <!-- Google Font: Kanit -->
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- FontAwesome -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        ← กลับหน้าหลัก
      </a>
      <span class="navbar-text fs-5">
        แบบฟอร์มยืมอุปกรณ์
      </span>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h4 class="mb-4"><i class="fa-solid fa-clipboard-list me-2"></i>แบบฟอร์มยืมอุปกรณ์</h4>
        <form id="loanForm">
          <!-- ข้อมูลผู้ยืม -->
          <div class="mb-4 border-bottom pb-3">
            <h6 class="mb-3"><i class="fa-solid fa-user me-2"></i>ข้อมูลผู้ยืม</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">ประเภทผู้ยืม*</label>
                <select class="form-select" required>
                  <option value="">เลือกประเภท</option>
                  <option>นักศึกษา</option>
                  <option>บุคลากร</option>
                  <option>อื่นๆ</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">ชื่อ-นามสกุล*</label>
                <input type="text" class="form-control" placeholder="ชื่อ-นามสกุล" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">รหัสอุปกรณ์*</label>
                <input type="text" class="form-control" placeholder="รหัสอุปกรณ์" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">เบอร์โทรศัพท์*</label>
                <input type="tel" class="form-control" placeholder="เบอร์โทรศัพท์" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">สาขาวิชา*</label>
                <select class="form-select" required>
                  <option value="">เลือกสาขาวิชา</option>
                  <option>วิทยาการคอมพิวเตอร์</option>
                  <option>วิศวกรรม</option>
                  <option>อื่นๆ</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">อีเมล์</label>
                <input type="email" class="form-control" placeholder="อีเมล์">
              </div>
            </div>
          </div>

          <!-- ข้อมูลอุปกรณ์ -->
          <div class="mb-4 border-bottom pb-3">
            <h6 class="mb-3"><i class="fa-solid fa-laptop-medical me-2"></i>ข้อมูลอุปกรณ์</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">เลือกอุปกรณ์*</label>
                <select id="equipmentSelect" class="form-select" required>
                  <option value="">เลือกอุปกรณ์</option>
                  <option>Fabian No.1</option>
                  <option>Fabian No.2</option>
                  <option>TE 171 No.2/83</option>
                  <!-- เพิ่มตามต้องการ -->
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">จำนวนที่ต้องการยืม*</label>
                <input type="number" class="form-control" placeholder="จำนวน" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">จำนวนคงเหลือ</label>
                <input type="text" id="availableCount" class="form-control" readonly placeholder="–">
              </div>
            </div>
          </div>

          <!-- สถานที่ -->
          <div class="mb-4 border-bottom pb-3">
            <h6 class="mb-3"><i class="fa-solid fa-map-marker-alt me-2"></i>สถานที่ใช้งาน</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">สถานที่ใช้งาน*</label>
                <select class="form-select" required>
                  <option value="">เลือกสถานที่</option>
                  <option>ห้อง LAB 1</option>
                  <option>ห้อง LAB 2</option>
                  <option>อื่นๆ</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">รายละเอียดเพิ่มเติม</label>
                <input type="text" class="form-control" placeholder="เช่น ชั้น, เลขห้อง">
              </div>
            </div>
          </div>

          <!-- ผู้อนุมัติ -->
          <div class="mb-4 border-bottom pb-3">
            <h6 class="mb-3"><i class="fa-solid fa-user-check me-2"></i>ข้อมูลผู้อนุมัติ</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">ผู้อนุมัติ*</label>
                <select id="approverSelect" class="form-select" required>
                  <option value="">เลือกผู้อนุมัติ</option>
                  <option>อ.ดร.สมชาย</option>
                  <option>อ.ดร.สมหญิง</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">ตำแหน่ง</label>
                <input type="text" id="approverPosition" class="form-control" readonly>
              </div>
              <div class="col-12">
                <label class="form-label">หมายเหตุ</label>
                <textarea class="form-control" rows="2" placeholder="บันทึกเพิ่มเติม (ถ้ามี)"></textarea>
              </div>
            </div>
          </div>

          <!-- วันที่ยืม / กำหนดคืน -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label">วันที่ยืม*</label>
              <input type="text" id="borrowDate" class="form-control" readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label">กำหนดวันคืน*</label>
              <input type="date" id="returnDate" class="form-control" required>
            </div>
          </div>

          <div class="text-end">
            <button type="reset" class="btn btn-outline-secondary me-2">
              <i class="fa-solid fa-rotate-left"></i> ล้างฟอร์ม
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i> บันทึกยืม
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // เติมเวลาในฟิลด์ วันที่ยืม
    function updateBorrowDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2,'0');
      const mm = String(now.getMonth()+1).padStart(2,'0');
      const yyyy = now.getFullYear() + 543;  // พ.ศ.
      const hh = String(now.getHours()).padStart(2,'0');
      const mi = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('borrowDate').value = 
        `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
    }

    // เปลี่ยนตำแหน่งเมื่อเลือกผู้อนุมัติ
    const approverMap = {
      'อ.ดร.สมชาย': 'คณบดี',
      'อ.ดร.สมหญิง': 'รองคณบดี'
    };

    document.addEventListener('DOMContentLoaded', () => {
      updateBorrowDate();

      document.getElementById('approverSelect')
        .addEventListener('change', e => {
          document.getElementById('approverPosition').value =
            approverMap[e.target.value] || '';
        });

      // (ถ้าต้องการ ดึงจำนวนคงเหลือจากฐานข้อมูล/localStorage)
      document.getElementById('equipmentSelect')
        .addEventListener('change', e => {
          // ตัวอย่างตั้งเป็นค่าคงเหลือ 5 (ให้แก้เป็นดึงข้อมูลจริง)
          document.getElementById('availableCount').value = '5';
        });

      // จับ event submit
      document.getElementById('loanForm')
        .addEventListener('submit', function(e){
          e.preventDefault();
          alert('บันทึกคำขอยืมเรียบร้อยแล้ว');
          this.reset();
          updateBorrowDate();
        });
    });
  </script>
</body>
</html>
